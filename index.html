<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Speed Reader - Focused speed reading, one word at a time</title>
    <meta name="title" content="Speed Reader - Focused speed reading, one word at a time" />
    <meta name="description" content="Read faster and stay focused. Words appear one at a time at a fixed focal point. Supports PDF and EPUB files, adjustable speed, ambient effects and a choice of reading fonts." />
    <meta name="keywords" content="speed reading, focus reading, reading app, PDF reader, EPUB reader, words per minute, focus mode, concentration" />
    <meta name="author" content="Speed Reader" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://spid.reader.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://spid.reader.app/" />
    <meta property="og:title" content="Speed Reader - Focused speed reading, one word at a time" />
    <meta property="og:description" content="Read faster and stay focused. PDF and EPUB support, adjustable speed, ambient effects and a choice of reading fonts." />
    <meta property="og:site_name" content="Speed Reader" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Speed Reader - Focused speed reading, one word at a time" />
    <meta name="twitter:description" content="Read faster and stay focused. PDF and EPUB support, adjustable speed, ambient effects and a choice of reading fonts." />

    <!-- Theme Color -->
    <meta name="theme-color" content="#04050b" />
    <meta name="msapplication-TileColor" content="#04050b" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Speed Reader",
      "description": "Focused speed reading — one word at a time at a fixed focal point.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Adjustable reading speed (WPM)",
        "PDF file support",
        "EPUB file support",
        "Focus mode",
        "Punctuation pause",
        "Font selection",
        "Ambient effect toggles",
        "Concentration pattern"
      ]
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
